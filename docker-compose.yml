# Systronaut Deploy -- unified stack.
#   control-plane : SYSTRONAUT web UI + REST API (bridge, :5000)
#   pxe-engine    : dnsmasq proxyDHCP + TFTP + nginx + hardened API (host network)
#   designer      : drawio architecture designer (bridge, :8082)
#
# The pxe-engine uses host networking because proxyDHCP/TFTP/PXE must operate at
# layer 2 on the real LAN -- this is a Linux-host production deployment.
# The ansible/ tree is mounted READ-ONLY as the OS answer-file lookup; it is
# served, never executed.
services:
  control-plane:
    build:
      context: ./control-plane
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: systronaut-control-plane
    restart: unless-stopped
    env_file: .env
    # Reach the host-networked pxe-engine from this bridged container. Works on
    # Linux (host-gateway) and Docker Desktop / macOS (host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PXE_ENGINE_URL: "http://host.docker.internal:8081"
      CONTROL_PLANE_DB: "/data/control-plane.db"
      APP_VERSION: ${APP_VERSION:-dev}
      UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-}
      PXE_LOOKUP_DIR: "/srv/lookup"
    ports:
      - "5000:5000"
    volumes:
      - control-plane-data:/data
      # Same answer-file tree the engine serves, read-only, so the backend can
      # render the OS-level *.ipxe.j2 (Jinja2 lives in / is rendered by the backend).
      - ./ansible/roles/pxe/files:/srv/lookup:ro
    depends_on:
      - pxe-engine

  pxe-engine:
    build: ./pxe-engine
    container_name: systronaut-pxe-engine
    restart: unless-stopped
    # proxyDHCP / TFTP / PXE need raw LAN access (Linux only).
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    env_file: .env
    volumes:
      # os_pxe_lab answer-file tree as the read-only HTTP content lookup.
      - ./ansible/roles/pxe/files:/var/www/html/lookup:ro
      # Auto-built OS install trees (downloaded + extracted in-container).
      - pxe-install:/var/www/html/install
      - pxe-engine-data:/data

  designer:
    build: ./designer/alpine/
    container_name: systronaut-designer
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      PUBLIC_DNS: systronaut
      ORGANISATION_UNIT: admin
      ORGANISATION: com
      CITY: Düsseldorf
      STATE: NW
      COUNTRY_CODE: DE

volumes:
  control-plane-data:
  pxe-engine-data:
  pxe-install:
