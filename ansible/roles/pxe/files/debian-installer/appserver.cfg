# Localization
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string DE
d-i debian-installer/allow_unauthenticated string true

d-i keyboard-configuration/xkb-keymap select de
d-i languagechooser/language-name-fb select German
d-i countrychooser/country-name select Switzerland
d-i console-setup/layoutcode string de_DE

# Network configuration (use DHCP)
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 5
d-i netcfg/dhcpv6_timeout string 0
d-i netcfg/get_hostname string to-be-set
d-i netcfg/get_domain string .lan

# Static network configuration (uncomment and configure if using static IP)
# d-i netcfg/get_nameservers string 192.168.100.1
# d-i netcfg/get_ipaddress string 192.168.100.142
# d-i netcfg/get_netmask string 255.255.255.0
# d-i netcfg/get_gateway string 192.168.100.1
# d-i netcfg/confirm_static boolean true

# Account setup
d-i passwd/root-login boolean true
#d-i passwd/make-user boolean false
#d-i passwd/root-password password lan
#d-i passwd/root-password-again password lan
# or encrypted using a crypt(3)  hash.
# d-i passwd/root-password-crypted password [crypt(3) hash]
#d-i user-setup/allow-password-weak boolean false
#d-i user-setup/encrypt-home boolean false

# Benutzer erstellen
d-i passwd/make-user boolean true
d-i passwd/user-fullname string iDustBin
d-i passwd/username string idustbin
