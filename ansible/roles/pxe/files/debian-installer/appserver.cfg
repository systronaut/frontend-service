d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false


# Clock and time zone setup
d-i clock-setup/utc boolean true
d-i time/zone string EU/Zurich
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string ntp11.metas.ch

### Partitioning and LVM Setup for UEFI ###

# Clear old metadata
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/device_remove_lvm_span boolean true
d-i partman-auto/purge_lvm_from_device boolean true

# LVM method
d-i partman-auto/method string lvm
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Don't create LVM /boot
d-i partman-auto-lvm/no_boot boolean true

# Target Disk
d-i partman-auto/disk string /dev/sda
d-i partman-auto-lvm/new_vg_name string vg-server
d-i partman-auto/choose_recipe select custom-lvm
d-i partman/default_filesystem string ext4
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-auto-lvm/guided_size string max

# Expert Recipe with EFI partition
d-i partman-auto/expert_recipe string \
      custom-lvm :: \
        1 1 512 fat32 \
            $primary{ } \
            method{ efi } format{ } \
            mountpoint{ /boot/efi } \
        . \
        300 300 300 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /boot } \
        . \
        5000 70 3000 ext4 \
            $lvmok{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            options/relatime{ relatime } \
            mountpoint{ / } \
        . \
        2000 60 -1 ext4 \
            $lvmok{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            options/relatime{ relatime } \
            mountpoint{ /usr } \
        . \
        8000 80 10000 ext4 \
            $lvmok{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /tmp } \
            options/relatime{ relatime } \
            options/nosuid{ nosuid } \
            options/nodev{ nodev } \
            options/noexec{ noexec } \
        . \
        5000 50 10000 ext4 \
            $lvmok{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /home } \
            options/relatime{ relatime } \
            options/nosuid{ nosuid } \
            options/nodev{ nodev } \
        . \
        5000 85 10000 ext4 \
            $lvmok{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /var } \
            options/relatime{ relatime } \
        .

# Final confirmation and partitioning
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/partitioning/confirm boolean true
d-i partman/partitioning/confirm_nooverwrite boolean true
d-i partman/partitioning/confirm_write boolean true

# Add Init7 Repository
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/method string http
d-i apt-setup/http/hostname string deb.debian.org
d-i apt-setup/http/directory string /debian
d-i apt-setup/http/components multiselect main,contrib,non-free

# Package mirror
#d-i mirror/country string manual
#d-i mirror/http/hostname string ftp.debian.org
#d-i mirror/http/directory string /debian
#d-i apt-setup/services-select multiselect security, updates
#d-i apt-setup/security_host string ftp.debian.org

d-i mirror/country string manual
d-i mirror/http/hostname string ftp.de.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i mirror/codename string trixie
d-i apt-setup/services-select multiselect

# Package selection
tasksel tasksel/first multiselect ssh-server standard

# Automatically install grub to the MBR
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Turn off last message about the install being complete
d-i finish-install/reboot_in_progress note
d-i pkgsel/include string openssh-server ntpsec sudo open-vm-tools vim

# Do not install recommends
d-i base-installer/install-recommends boolean false

# Set post-install stuff
d-i preseed/late_command string cp -a /postseed.sh /target/root ; \
                                in-target chmod +x /root/postseed.sh ; \
                                in-target /root/postseed.sh ; \
                                in-target sed "s/PermitRootLogin\ without-password/PermitRootLogin\ yes/" -i /etc/ssh/sshd_config ; \
                                in-target echo "/tmp /var/tmp none rw,noexec,nosuid,nodev,bind 0 0" >> /etc/fstab
