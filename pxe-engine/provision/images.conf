# Systronaut PXE engine -- install-tree manifest.
# The in-container provisioner downloads + extracts these automatically at
# startup (no admin/user interaction). Idempotent + cached in the data volume.
#
# Format (pipe-separated):  key|mode|url|enabled
#   key     : OS key, must match control-plane catalog (creates /install/<key>/)
#   mode    : netboot  -> download a .tar.gz and extract
#             iso      -> download an ISO and extract with bsdtar (no mount)
#             windows  -> ISO extract (WinPE/boot.wim handling, best-effort)
#   url     : public, no-auth download URL (verify per release)
#   enabled : 1 = provision automatically, 0 = skip
#
# Defaults enable only public, no-auth sources. Subscription-gated OSes (RHEL,
# SLES) are disabled until you supply their URLs/credentials. Edit + restart, or
# set PXE_PROVISION=0 to disable the provisioner entirely.

# key         | mode    | url                                                                                                   | enabled
debian13       | netboot | https://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images/netboot/netboot.tar.gz | 1
