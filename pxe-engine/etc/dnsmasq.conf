# Systronaut PXE engine -- dnsmasq (proxyDHCP, UEFI/iPXE).
# Mirrors os_pxe_lab/setup.yml. Tune PXE_* via the entrypoint/env, or edit here.
#
# proxyDHCP: coexists with an existing DHCP server -- it only answers PXE/boot
# options, never hands out IPs. Safe to run on a managed LAN.

# DNS off: this box is a boot server, not a resolver.
port=0

log-dhcp
log-queries

# Interface + range are injected by the entrypoint from PXE_INTERFACE / PXE_SUBNET.
# Example (UEFI proxyDHCP on the lab subnet):
#   interface=eth0
#   dhcp-range=192.168.73.0,proxy
#   listen-address=127.0.0.1,192.168.73.128
#   pxe-service=X86-64_EFI,"PXE Boot (UEFI 64-bit)",snponly.efi

enable-tftp
tftp-root=/var/lib/tftpboot

# Per-host reservations live here, one validated include file per MAC, written
# by api.py. Never edited inline.
conf-dir=/etc/dnsmasq.d/hosts,*.conf
