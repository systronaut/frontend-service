# Systronaut PXE engine -- nginx serves the install tree + per-host iPXE scripts.
# Read-only content; no upload, no exec. The os_pxe_lab answer-file tree is
# mounted at /var/www/html/lookup (read-only); per-host scripts under /host.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    autoindex off;
    server_tokens off;

    # Per-MAC boot scripts + hardening overlays written by api.py.
    location /host/ { try_files $uri =404; }

    # The os_pxe_lab content lookup (kickstart/preseed/autoinstall/iPXE).
    location / { try_files $uri $uri/ =404; }
}
