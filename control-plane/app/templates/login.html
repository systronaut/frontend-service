{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="hero text-center mb-4">
      <h1>SYSTRONAUT<span style="color:var(--brand-accent)">.</span></h1>
      <div class="tagline">Secure VM deployment &mdash; bare metal &amp; cloud</div>
      <div class="mt-3">
        <span class="badge badge-std badge-pill p-2">NIS2</span>
        <span class="badge badge-std badge-pill p-2">ISO 27001</span>
      </div>
    </div>
    <div class="surface p-4">
      <h5 class="mb-3">Sign in</h5>
      <form method="post" action="{{ url_for('web.login_post') }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group">
          <label>Username</label>
          <input name="username" class="form-control" autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
